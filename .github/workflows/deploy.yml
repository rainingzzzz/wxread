# .github/workflows/deploy.yml
# 基于上游 findmover/wxread@main（2026-09-29，含 PR #138~#141）改造
# 改动：2 次/天、失败重试、失败通知+日志、超时保护、去掉写死 DNS
name: wxread

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  schedule:
    # 北京时间 09:07（UTC 01:07），非整点避开调度高峰
    - cron: '7 1 * * *'
    # 北京时间 21:07（UTC 13:07），第二次运行多一次刷新 wr_skey 的机会
    - cron: '7 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    environment: AutoRead

    env:
      WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
      PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}
      READ_NUM: ${{ vars.READ_NUM }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

      - name: Run deployment script (attempt 1)
        id: run1
        continue-on-error: true
        run: |
          set -o pipefail
          python main.py 2>&1 | tee run.log

      - name: Run deployment script (retry once)
        id: run2
        if: steps.run1.outcome == 'failure'
        run: |
          echo "::warning::第 1 次运行失败，60 秒后重试一次"
          sleep 60
          python main.py 2>&1 | tee -a run.log

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wxread-log-${{ github.run_number }}
          path: run.log
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          TITLE="wxread 运行失败 #${{ github.run_number }}"
          LINK="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="$(date -u '+%F %T') UTC / ${LINK}"
          if [ -n "$SERVERCHAN_SPT" ]; then
            curl -sS -X POST "https://sctapi.ftqq.com/${SERVERCHAN_SPT}.send" --data-urlencode "title=${TITLE}" --data-urlencode "desp=${BODY}" || true
          fi
          if [ -n "$PUSHPLUS_TOKEN" ]; then
            curl -sS -X POST "https://www.pushplus.plus/send" -H "Content-Type: application/json" -d "{\"token\":\"${PUSHPLUS_TOKEN}\",\"title\":\"${TITLE}\",\"content\":\"${BODY}\"}" || true
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${TITLE} ${BODY}" || true
          fi

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
